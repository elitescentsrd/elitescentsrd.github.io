name: Professional website upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare Python
        run: python -m pip install --quiet pillow

      - name: Apply upgrades step by step
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import subprocess, re, json, os, shutil

          ROOT = Path('.')
          INDEX = Path('index.html')
          CATALOG = Path('catalogo.html')

          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)

          def commit(msg):
              subprocess.run(['git','add','-A'], check=True)
              r = subprocess.run(['git','diff','--cached','--quiet'])
              if r.returncode != 0:
                  subprocess.run(['git','commit','-m',msg], check=True)

          # ---------------------------------------------------------
          # 1. Featured products become useful catalog entry points.
          # ---------------------------------------------------------
          s = INDEX.read_text(encoding='utf-8')
          s = s.replace('.mini-link{font-weight:800;font-size:14px;color:var(--gold-deep)}', '.card-link{display:inline-flex;align-items:center;justify-content:center;margin-top:auto;padding-top:12px;color:var(--gold-deep);font-size:14px;font-weight:900}.card-link:hover{text-decoration:underline}.product-card{display:flex;flex-direction:column}')

          featured = [
              ('212 Sexy EDT Men', 'catalogo.html?page=2'),
              ('212 VIP Black EDP Men', 'catalogo.html?page=2'),
              ('9 PM EDP Men Afnan', 'catalogo.html?page=2'),
              ('Acqua di Gio Profondo EDP Men', 'catalogo.html?page=3'),
              ('Ariana Grande Cloud', 'catalogo.html'),
              ('Armaf Lionheart Woman', 'catalogo.html'),
          ]
          for name, href in featured:
              pat = rf'(<h3>{re.escape(name)}</h3>.*?<p>.*?</p>)(</article>)'
              repl = rf'\1<a class="card-link" href="{href}" aria-label="Ver {name} en el catálogo">Ver en catálogo →</a>\2'
              s, _ = re.subn(pat, repl, s, count=1, flags=re.S)
          INDEX.write_text(s, encoding='utf-8')
          commit('1. Make featured perfumes interactive')

          # ---------------------------------------------------------
          # 2. Split the four heavy catalog sheets into 36 pages and
          #    replace the catalog with a page-by-page mobile viewer.
          # ---------------------------------------------------------
          pages = Path('pages')
          pages.mkdir(exist_ok=True)
          page_no = 1
          for block_no in range(1, 5):
              src = Path(f'catalogo-{block_no}.webp')
              im = Image.open(src).convert('RGB')
              w, h = im.size
              crops = []
              if h / max(w,1) > 2.2:
                  for i in range(9):
                      y0 = round(i*h/9); y1 = round((i+1)*h/9)
                      crops.append(im.crop((0,y0,w,y1)))
              elif w / max(h,1) > 2.2:
                  for i in range(9):
                      x0 = round(i*w/9); x1 = round((i+1)*w/9)
                      crops.append(im.crop((x0,0,x1,h)))
              else:
                  for row in range(3):
                      for col in range(3):
                          x0 = round(col*w/3); x1 = round((col+1)*w/3)
                          y0 = round(row*h/3); y1 = round((row+1)*h/3)
                          crops.append(im.crop((x0,y0,x1,y1)))
              for crop in crops:
                  crop.save(pages / f'page-{page_no:02d}.webp', 'WEBP', quality=86, method=6)
                  page_no += 1

          catalog_html = '''<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo 2026 | Elite Scents RD</title><meta name="description" content="Catálogo oficial 2026 de Elite Scents RD. Navega las 36 páginas de perfumes de forma rápida desde móvil o computadora."><meta name="theme-color" content="#0b0a0a"><meta name="robots" content="index,follow"><link rel="icon" href="logo.svg" type="image/svg+xml"><link rel="canonical" href="https://elitescentsrd.github.io/catalogo.html"><style>:root{--bg:#f8f4ea;--card:#fffdf8;--ink:#0b0a0a;--muted:#675f55;--gold:#d3a74d;--gold-deep:#9f741d;--line:#dfcb94;--black:#0b0a0a;--shadow:0 14px 40px rgba(11,10,10,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}a{text-decoration:none;color:inherit}.container{width:min(920px,92%);margin:auto}.nav{position:sticky;top:0;z-index:30;background:rgba(11,10,10,.97);border-bottom:1px solid rgba(211,167,77,.38)}.nav-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:9px;color:var(--gold);font-family:Georgia,serif;font-weight:700;font-size:21px}.brand img{width:36px;height:36px;border-radius:10px}.back{padding:10px 14px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;font-weight:800;font-size:13px}.hero{padding:46px 0 34px;text-align:center;background:radial-gradient(circle at 50% 0%,rgba(211,167,77,.16),transparent 42%),linear-gradient(135deg,#060606,#17130d 55%,#090909);color:#fff}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:.14em;font-size:11px;text-transform:uppercase}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(40px,8vw,66px);line-height:1;margin:10px auto 14px}.hero p{max-width:650px;margin:auto;color:#d9d1c3;font-size:16px}.quick{padding:28px 0 18px}.quick-label{text-align:center;color:var(--muted);font-size:13px;font-weight:800;margin-bottom:12px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button,.control,.page-select{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--gold-deep);border-radius:14px;padding:12px 9px;font:inherit;font-size:13px;font-weight:900;cursor:pointer}.quick button:hover,.quick button.active{background:var(--black);color:var(--gold);border-color:var(--gold)}.viewer{padding:18px 0 82px}.viewer-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}.viewer-head h2{font-family:Georgia,serif;font-size:30px;margin:3px 0}.viewer-head small{color:var(--muted)}.jump{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:800}.page-select{padding:9px 10px;background:#fff}.image-shell{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);min-height:260px;display:grid;place-items:center}.catalog-img{display:block;width:100%;height:auto;cursor:zoom-in}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:var(--muted);font-weight:800}.controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:16px}.control{padding:13px 14px}.control:last-child{justify-self:stretch}.control:disabled{opacity:.38;cursor:not-allowed}.counter{text-align:center;font-weight:900;color:var(--ink);white-space:nowrap}.note{text-align:center;color:var(--muted);font-size:12px;margin:17px 0 0}.whatsapp{position:fixed;right:14px;bottom:14px;z-index:50;background:var(--gold);color:var(--black);padding:13px 16px;border:1px solid #efd382;border-radius:999px;font-weight:900;box-shadow:0 12px 32px rgba(0,0,0,.25)}.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;padding:62px 10px 24px}.lightbox.open{display:flex}.lightbox img{display:block;max-width:96vw;max-height:88vh;width:auto;height:auto;object-fit:contain;touch-action:pinch-zoom}.close{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:#111;color:var(--gold);font-size:26px;cursor:pointer}@media(max-width:700px){.quick-grid{grid-template-columns:repeat(2,1fr)}.hero{padding:36px 0 28px}.viewer-head{align-items:flex-start;flex-direction:column}.image-shell{border-radius:14px;min-height:200px}.controls{grid-template-columns:1fr 1fr}.counter{grid-column:1/-1;grid-row:1}.control{grid-row:2}.brand{font-size:18px}.whatsapp{right:12px;bottom:12px;font-size:14px}}@media(max-width:380px){.back{padding:9px 11px;font-size:12px}.brand{font-size:16px}}</style></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="index.html"><img src="logo.svg" alt="">Elite Scents RD</a><a class="back" href="index.html">← Inicio</a></div></header><section class="hero"><div class="container"><div class="eyebrow">Catálogo oficial 2026</div><h1>Catálogo completo</h1><p>Explora una página a la vez. Así el catálogo carga más rápido y consume menos datos en el móvil.</p></div></section><section class="quick"><div class="container"><div class="quick-label">Ir rápidamente a un bloque</div><div class="quick-grid"><button type="button" data-page="1">Páginas 1–9</button><button type="button" data-page="10">Páginas 10–18</button><button type="button" data-page="19">Páginas 19–27</button><button type="button" data-page="28">Páginas 28–36</button></div></div></section><main class="viewer"><div class="container"><div class="viewer-head"><div><small id="rangeLabel">Páginas 1–9</small><h2 id="pageTitle">Página 1</h2></div><label class="jump">Ir a página <select class="page-select" id="pageSelect" aria-label="Ir a una página del catálogo"></select></label></div><div class="image-shell"><div class="loading" id="loading">Cargando página…</div><img class="catalog-img" id="catalogImage" alt="Página 1 del catálogo Elite Scents RD"></div><div class="controls"><button class="control" id="prev" type="button">← Anterior</button><div class="counter" id="counter">Página 1 de 36</div><button class="control" id="next" type="button">Siguiente →</button></div><p class="note">Toca la página para verla a pantalla completa. Precios y disponibilidad sujetos a confirmación al momento del pedido.</p></div></main><a class="whatsapp" href="https://wa.me/18094333348?text=Hola%20Elite%20Scents%20RD%2C%20vi%20una%20fragancia%20en%20su%20web%20y%20quiero%20consultar%20disponibilidad%2C%20precio%20final%20y%20opciones%20de%20entrega." target="_blank" rel="noopener" aria-label="Pedir por WhatsApp">Pedir por WhatsApp</a><div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="close" type="button" aria-label="Cerrar">×</button><img id="zoomImage" alt=""></div><script>(function(){const total=36,img=document.getElementById('catalogImage'),loading=document.getElementById('loading'),title=document.getElementById('pageTitle'),counter=document.getElementById('counter'),range=document.getElementById('rangeLabel'),prev=document.getElementById('prev'),next=document.getElementById('next'),select=document.getElementById('pageSelect'),quick=[...document.querySelectorAll('.quick button')],box=document.getElementById('lightbox'),zoom=document.getElementById('zoomImage'),close=document.getElementById('close');for(let i=1;i<=total;i++){const o=document.createElement('option');o.value=i;o.textContent=i;select.appendChild(o)}function clamp(n){return Math.max(1,Math.min(total,n||1))}function block(n){if(n<=9)return 'Páginas 1–9';if(n<=18)return 'Páginas 10–18';if(n<=27)return 'Páginas 19–27';return 'Páginas 28–36'}function file(n){return 'pages/page-'+String(n).padStart(2,'0')+'.webp'}function load(n,push=true){n=clamp(Number(n));loading.hidden=false;img.style.visibility='hidden';img.onload=()=>{loading.hidden=true;img.style.visibility='visible'};img.onerror=()=>{loading.textContent='No pudimos cargar esta página. Intenta nuevamente.'};img.src=file(n);img.alt='Página '+n+' del catálogo Elite Scents RD';title.textContent='Página '+n;counter.textContent='Página '+n+' de '+total;range.textContent=block(n);prev.disabled=n===1;next.disabled=n===total;prev.dataset.page=n-1;next.dataset.page=n+1;select.value=n;quick.forEach(b=>{const start=Number(b.dataset.page);b.classList.toggle('active',n>=start&&n<=start+8)});if(push){const u=new URL(location.href);u.searchParams.set('page',n);history.replaceState({},'',u)}}prev.addEventListener('click',()=>load(prev.dataset.page));next.addEventListener('click',()=>load(next.dataset.page));select.addEventListener('change',()=>load(select.value));quick.forEach(b=>b.addEventListener('click',()=>load(b.dataset.page)));img.addEventListener('click',()=>{zoom.src=img.src;zoom.alt=img.alt;box.classList.add('open');box.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'});function shut(){box.classList.remove('open');box.setAttribute('aria-hidden','true');zoom.src='';document.body.style.overflow=''}close.addEventListener('click',shut);box.addEventListener('click',e=>{if(e.target===box)shut()});document.addEventListener('keydown',e=>{if(e.key==='Escape')shut();if(!box.classList.contains('open')&&e.key==='ArrowLeft'&&!prev.disabled)load(prev.dataset.page);if(!box.classList.contains('open')&&e.key==='ArrowRight'&&!next.disabled)load(next.dataset.page)});const initial=clamp(Number(new URL(location.href).searchParams.get('page'))||1);load(initial,false)})();</script></body></html>'''
          CATALOG.write_text(catalog_html, encoding='utf-8')
          commit('2. Convert catalog to 36 lightweight pages')

          # ---------------------------------------------------------
          # 3. Keep Catalog visible in the mobile header.
          # ---------------------------------------------------------
          s = INDEX.read_text(encoding='utf-8')
          if 'class="catalog-mobile"' not in s:
              s = s.replace('</a><nav class="nav-links">', '</a><a class="catalog-mobile" href="catalogo.html">Catálogo</a><nav class="nav-links">', 1)
          s = s.replace('@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.nav-links a:not(.nav-cta){display:none}}', '@media(max-width:900px){.products{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.nav-links{display:none}.catalog-mobile{display:inline-flex}}')
          s = s.replace('.nav-links>a:not(.nav-cta):hover{color:var(--gold)}', '.nav-links>a:not(.nav-cta):hover{color:var(--gold)}.catalog-mobile{display:none;padding:9px 13px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-size:13px;font-weight:900}')
          INDEX.write_text(s, encoding='utf-8')
          commit('3. Keep catalog access visible on mobile')

          # ---------------------------------------------------------
          # 4. Add a compact trust section.
          # ---------------------------------------------------------
          s = INDEX.read_text(encoding='utf-8')
          trust_css = '.trust-strip{padding:20px 0;background:#fffdf8;border-bottom:1px solid var(--line)}.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.trust-item{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 10px;text-align:center;font-size:13px;font-weight:900;color:var(--ink)}.trust-check{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:50%;background:#f5e9c7;color:var(--gold-deep);font-weight:900}@media(max-width:700px){.trust-grid{grid-template-columns:repeat(2,1fr)}.trust-item{justify-content:flex-start;text-align:left}}'
          if '.trust-strip{' not in s:
              s = s.replace('</style>', trust_css + '</style>', 1)
          trust_html = '<section class="trust-strip" aria-label="Razones para comprar en Elite Scents RD"><div class="container trust-grid"><div class="trust-item"><span class="trust-check">✓</span>Fragancias originales</div><div class="trust-item"><span class="trust-check">✓</span>Venta bajo pedido</div><div class="trust-item"><span class="trust-check">✓</span>Envíos en RD</div><div class="trust-item"><span class="trust-check">✓</span>Atención personalizada</div></div></section>'
          if 'class="trust-strip"' not in s:
              s = s.replace('</section><section class="section" id="destacados">', '</section>'+trust_html+'<section class="section" id="destacados">', 1)
          INDEX.write_text(s, encoding='utf-8')
          commit('4. Add trust signals to the homepage')

          # ---------------------------------------------------------
          # 5. Professional footer + useful information pages.
          # ---------------------------------------------------------
          s = INDEX.read_text(encoding='utf-8')
          footer_css = '.footer-grid{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:34px;text-align:left}.footer-brand-name{display:flex;align-items:center;gap:10px;color:var(--gold);font-family:Georgia,serif;font-size:24px;font-weight:700}.footer-brand-name img{width:42px;height:42px}.footer h3{margin:0 0 14px;color:#fff;font-size:18px}.footer-grid p{margin:6px 0;color:#bdb5aa;font-size:14px}.footer-links{display:flex;flex-direction:column;gap:9px}.footer-links a{color:#d5cec4;font-size:14px;font-weight:700}.footer-links a:hover{color:var(--gold)}.footer-bottom{margin-top:38px;padding-top:20px;border-top:1px solid rgba(211,167,77,.22);color:#8f887e;font-size:12px;text-align:center}@media(max-width:800px){.footer-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.footer-grid{grid-template-columns:1fr}.footer{padding:52px 0}.footer-brand-name{justify-content:center}.footer-grid{text-align:center}.footer-links{align-items:center}}'
          if '.footer-grid{' not in s:
              s = s.replace('</style>', footer_css + '</style>', 1)
          footer = '''<footer class="footer"><div class="container"><div class="footer-grid"><div><div class="footer-brand-name"><img src="logo.svg" alt="">Elite Scents RD</div><p>Perfumes originales bajo pedido para cada ocasión, con atención directa en República Dominicana.</p></div><div><h3>Navega</h3><div class="footer-links"><a href="index.html">Inicio</a><a href="#destacados">Destacados</a><a href="catalogo.html">Catálogo completo</a><a href="#como-pedir">Cómo pedir</a></div></div><div><h3>Información</h3><div class="footer-links"><a href="pedidos-envios.html">Pedidos y entregas</a><a href="privacidad.html">Aviso de privacidad</a></div></div><div><h3>Elite Scents RD</h3><p>República Dominicana</p><p>Venta bajo pedido</p><p>Envíos disponibles</p><p>Catálogo oficial 2026</p></div></div><div class="footer-bottom">© 2026 Elite Scents RD · Todos los derechos reservados.</div></div></footer>'''
          s = re.sub(r'<footer class="footer">.*?</footer>', footer, s, count=1, flags=re.S)
          INDEX.write_text(s, encoding='utf-8')

          page_style = ''':root{--bg:#f8f4ea;--ink:#0b0a0a;--muted:#675f55;--gold:#d3a74d;--line:#dfcb94;--black:#0b0a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}.container{width:min(850px,92%);margin:auto}.nav{background:#0b0a0a;border-bottom:1px solid rgba(211,167,77,.4)}.nav-inner{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px;color:var(--gold);font-family:Georgia,serif;font-weight:700;font-size:21px}.brand img{width:36px;height:36px}.back{color:var(--gold);font-weight:900}.hero{padding:54px 0 38px;background:linear-gradient(135deg,#060606,#17130d);color:#fff;text-align:center}.hero h1{font-family:Georgia,serif;font-size:clamp(38px,7vw,58px);margin:6px 0}.hero p{color:#d7d0c5}.content{padding:52px 0 80px}.card{background:#fffdf8;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 14px 40px rgba(11,10,10,.08)}h2{font-family:Georgia,serif;margin-top:30px}h2:first-child{margin-top:0}.muted{color:var(--muted)}.whatsapp{position:fixed;right:14px;bottom:14px;background:var(--gold);color:var(--black);padding:13px 16px;border-radius:999px;font-weight:900;box-shadow:0 12px 32px rgba(0,0,0,.25)}@media(max-width:520px){.card{padding:22px}.brand{font-size:17px}}'''
