name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, 'work/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Reconstruye la web cada 6 horas para que precios, ofertas y datos estructurados del HTML sigan al día con Supabase.
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Antes de esta fecha solo se validan las fotos ya cargadas; desde ella se exigen las 420.
      IMAGE_CUTOFF: '2026-10-20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate static catalog and Product JSON-LD
        run: npm run build
      - name: Verify generated site
        run: npm test
      - name: Validate product photos (HTTP 200, type, size, dimensions)
        run: npm run test:images
      - name: Anonymous access checks against Supabase (RLS and permissions, read-only)
        run: npm run test:security
      - name: Build clean public artifact (_site/)
        run: npm run site
      # Revisión privada: en ramas y pull requests el artefacto _site/ se puede
      # descargar desde la ejecución del workflow (no se despliega a producción).
      - name: Upload review artifact (branches and pull requests)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-review-${{ github.run_number }}
          path: _site
          retention-days: 14
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
